<!DOCTYPE html>
<html lang="en">

<head>
    <title>SRXEditor</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../../css/dark.css">
</head>

<body style="width: 100%; height: 100vh; overflow:hidden;" onload="new Main();">

    <div class="topBar" id="toolbar">

        <a id="openFile" class="tooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24"
                width="24px" fill="#000000">
                <path
                    d="M9.17 6l2 2H20v10H4V6h5.17M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" />
            </svg>
            <span class="tooltiptext bottomTooltip">Open File</span>
        </a>

        <a id="newFile" class="tooltip"><svg xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24"
                height="24px" viewBox="0 0 24 24" width="24px" fill="#000000">
                <g>
                    <path d="M17,19.22H5V7h7V5H5C3.9,5,3,5.9,3,7v12c0,1.1,0.9,2,2,2h12c1.1,0,2-0.9,2-2v-7h-2V19.22z" />
                    <path d="M19,2h-2v3h-3c0.01,0.01,0,2,0,2h3v2.99c0.01,0.01,2,0,2,0V7h3V5h-3V2z" />
                    <rect height="2" width="8" x="7" y="9" />
                    <polygon points="7,12 7,14 15,14 15,12 12,12" />
                    <rect height="2" width="8" x="7" y="15" />
                </g>
            </svg>
            <span class="tooltiptext bottomTooltip">New File</span>
        </a>

        <a id="saveFile" class="tooltip"><svg xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24"
                height="24px" viewBox="0 0 24 24" width="24px" fill="#000000">
                <g>
                    <path
                        d="M18,15v3H6v-3H4v3c0,1.1,0.9,2,2,2h12c1.1,0,2-0.9,2-2v-3H18z M17,11l-1.41-1.41L13,12.17V4h-2v8.17L8.41,9.59L7,11l5,5 L17,11z" />
                </g>
            </svg><span class="tooltiptext bottomTooltip">Save File</span></a>

        <a id="testRules" class="tooltip"><svg xmlns="http://www.w3.org/2000/svg" enable-background="new 0 0 24 24"
                height="24px" viewBox="0 0 24 24" width="24px" fill="#000000">
                <g>
                    <path
                        d="M20,3H4C2.9,3,2,3.9,2,5v14c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V5 C22,3.9,21.1,3,20,3z M20,19H4V5h16V19z"
                        fill-rule="evenodd" />
                    <polygon fill-rule="evenodd"
                        points="19.41,10.42 17.99,9 14.82,12.17 13.41,10.75 12,12.16 14.82,15" />
                    <rect fill-rule="evenodd" height="2" width="5" x="5" y="7" />
                    <rect fill-rule="evenodd" height="2" width="5" x="5" y="11" />
                    <rect fill-rule="evenodd" height="2" width="5" x="5" y="15" />
                </g>
            </svg><span class="tooltiptext bottomTooltip">Test Rules</span></a>

        <span class="fill_width">&nbsp;</span>

        <a id="help" class="tooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24"
                width="24px" fill="#000000">
                <path
                    d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z" />
            </svg><span class="tooltiptext bottomRightTooltip">Help</span></a>
    </div>

    <div class="dialogBody" id="dialogBody">

        <h3 id="label">Languages</h3>

        <div class="dialogRow middle">
            <div id="topContainer" class="divContainer bordered" style="height:220px;">
                <table class="dialogTable">
                    <thead>
                        <tr>
                            <th>Language Name</th>
                            <th>Language Pattern</th>
                        </tr>
                    </thead>
                    <tbody id="LanguageRules" class="stripes">
                        <tr>
                            <td>Catalan</td>
                            <td>ca.*</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="column" style="margin-left: 8px;">
                <button id="moveRuleUp" class="tooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                        viewBox="0 0 24 24" width="24px" fill="#ffffff">
                        <path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41z" />
                    </svg><span class="tooltiptext topRightTooltip">Move Language Up</span></button>
                <button id="moveRuleDown" class="tooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                        viewBox="0 0 24 24" width="24px" fill="#ffffff">
                        <path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                    </svg><span class="tooltiptext bottomRightTooltip">Move Language Down</span></button>
            </div>
        </div>

        <div class="buttonArea" id="buttonArea">
            <button id="addLangRule">Add Language</button>
            <button id="editLangRule">Edit Language</button>
            <button id="removeLangRule">Remove Language</button>
        </div>

        <h3>Rules</h3>

        <div class="dialogRow middle">
            <div id="bottomContainer" class="divContainer bordered" style="height:220px;">
                <table class="dialogTable">
                    <thead>
                        <tr>
                            <th>Break</th>
                            <th>Before Break</th>
                            <th>After Break</th>
                        </tr>
                    </thead>
                    <tbody id="LanguageRules" class="stripes">
                        <tr>
                            <td>no</td>
                            <td>\ba\. C\.</td>
                            <td>\s</td>
                        </tr>
                        <tr>
                            <td>no</td>
                            <td>\ba\. m\.</td>
                            <td>\s</td>
                        </tr>
                        <tr>
                            <td>no</td>
                            <td>\babr\.</td>
                            <td>\s</td>
                        </tr>
                        <tr>
                            <td>no</td>
                            <td>\babr\.</td>
                            <td>\s</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="column" style="margin-left: 8px;">
                <button id="moveRuleUp" class="tooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                        viewBox="0 0 24 24" width="24px" fill="#ffffff">
                        <path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41z" />
                    </svg><span class="tooltiptext topRightTooltip">Move Rule Up</span></button>
                <button id="moveRuleDown" class="tooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                        viewBox="0 0 24 24" width="24px" fill="#ffffff">
                        <path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                    </svg><span class="tooltiptext bottomRightTooltip">Move Rule Down</span></button>
            </div>
        </div>

        <div class="buttonArea">
            <button id="addRule">Add Rule</button>
            <button id="editRule">Edit Rule</button>
            <button id="removeRule">Remove Rule</button>
        </div>

    </div>
    <script src="../../js/main.js"></script>
</body>

</html>

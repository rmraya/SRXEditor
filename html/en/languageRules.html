<!DOCTYPE html>
<html lang="en">

<head>
    <title>Language Rule</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../../css/dark.css">
</head>

<body class="dialogBody" onload="new LanguageDialog();">

    <table>
        <tr>
            <td class="middle">
                <label for="langName">Language Name</label>
            </td>
            <td class="middle fill_width">
                <input id="langName" class="fill_width">
            </td>
        </tr>
        <tr>
            <td class="middle">
                <label for="pattern">Language Pattern</label>
            </td>
            <td class="middle fill_width">
                <input id="pattern" class="fill_width">
            </td>
        </tr>
    </table>

    <div class="buttonArea">
        <button id="save">Save Language Rule</button>
    </div>
    <script src="../../js/languageDialog.js"></script>
    <script src="../../js/messageTypes.js"></script>
</body>

</html>

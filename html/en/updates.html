<!Doctype html>
<html>

<head>
    <title>Software Updates</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../../css/light.css">
</head>

<body class="dialogBody">

    <div class="row">
        <img src="../../img/srxeditor.png" width="120" style="padding: 10px;" />
        <div>
            <p class="center">An updated version of SRXEditor is available</p>
            <table>
                <tr>
                    <td class="noWrap">Installed Version:</td>
                    <td id="current" class="fill_width"></td>
                </tr>
                <tr>
                    <td class="noWrap">Latest Version:</td>
                    <td id="latest" class="fill_width"></td>
                </tr>
            </table>
        </div>
    </div>

    <div class="buttonArea">
        <button id="download">Download Update</button>
    </div>
    <script>
        const { Updates } = require('../../js/updates.js');
        new Updates();
    </script>
</body>

</html>

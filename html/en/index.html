<!DOCTYPE html>
<html lang="en">

<head>
    <title>SRXEditor</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../../css/light.css">
</head>

<body style="width: 100%; height: 100vh; overflow:hidden;">

    <div class="topBar" id="toolbar">

        <a id="openFile" class="tooltip bottomTooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h240l80 80h320q33 0 56.5 23.5T880-640v400q0 33-23.5 56.5T800-160H160Zm0-80h640v-400H447l-80-80H160v480Zm0 0v-480 480Z"/></svg>
            <span class="tooltiptext bottomTooltip">Open File</span>
        </a>

        <a id="newFile" class="tooltip bottomTooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h360v80H200v560h560v-360h80v360q0 33-23.5 56.5T760-120H200Zm120-160v-80h320v80H320Zm0-120v-80h320v80H320Zm0-120v-80h320v80H320Zm360-80v-80h-80v-80h80v-80h80v80h80v80h-80v80h-80Z"/></svg>
            <span class="tooltiptext bottomTooltip">New File</span>
        </a>

        <a id="saveFile" class="tooltip bottomTooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg><span class="tooltiptext bottomTooltip">Save File</span></a>

        <a id="editHeader" class="tooltip bottomTooltip" style="margin-left: 10px;"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                viewBox="0 -960 960 960" width="24px">
                <path
                    d="m384-336 56-57-87-87 87-87-56-57-144 144 144 144Zm192 0 144-144-144-144-56 57 87 87-87 87 56 57ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z" />
            </svg><span class="tooltiptext bottomTooltip">Edit Header</span></a>

        <a id="testRules" class="tooltip bottomTooltip" style="margin-left: 10px;"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M160-120q-33 0-56.5-23.5T80-200v-560q0-33 23.5-56.5T160-840h640q33 0 56.5 23.5T880-760v560q0 33-23.5 56.5T800-120H160Zm0-80h640v-560H160v560Zm40-80h200v-80H200v80Zm382-80 198-198-57-57-141 142-57-57-56 57 113 113Zm-382-80h200v-80H200v80Zm0-160h200v-80H200v80Zm-40 400v-560 560Z"/></svg><span class="tooltiptext bottomTooltip">Test Rules</span></a>

        <span class="fill_width">&nbsp;</span>

        <a id="help" class="tooltip bottomRightTooltip" style="margin-right: 16px;"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M513.5-254.5Q528-269 528-290t-14.5-35.5Q499-340 478-340t-35.5 14.5Q428-311 428-290t14.5 35.5Q457-240 478-240t35.5-14.5ZM442-394h74q0-33 7.5-52t42.5-52q26-26 41-49.5t15-56.5q0-56-41-86t-97-30q-57 0-92.5 30T342-618l66 26q5-18 22.5-39t53.5-21q32 0 48 17.5t16 38.5q0 20-12 37.5T506-526q-44 39-54 59t-10 73Zm38 314q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></svg><span class="tooltiptext bottomRightTooltip">Help</span></a>
    </div>

    <div class="dialogBody" id="dialogBody">

        <h3 id="label">Languages</h3>

        <div class="dialogRow middle">
            <div id="topContainer" class="divContainer bordered" style="height:220px;">
                <table class="dialogTable">
                    <thead>
                        <tr>
                            <th class="left">Language Name</th>
                            <th class="left">Language Pattern</th>
                        </tr>
                    </thead>
                    <tbody id="LanguageMap" class="stripes">

                    </tbody>
                </table>
            </div>

            <div class="column" style="margin-left: 8px; gap: 4px;">
                <button id="moveLanguageUp" class="tooltip topRightTooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M480-528 296-344l-56-56 240-240 240 240-56 56-184-184Z"/></svg><span class="tooltiptext topRightTooltip">Move Language Up</span></button>
                <button id="moveLanguageDown" class="tooltip bottomRightTooltip"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z"/></svg><span class="tooltiptext bottomRightTooltip">Move Language Down</span></button>
            </div>
        </div>

        <div class="buttonArea" id="buttonArea">
            <button id="addLang">Add Language</button>
            <button id="editLang">Edit Language</button>
            <button id="removeLang">Remove Language</button>
        </div>

        <h3>Rules</h3>

        <div class="dialogRow middle">
            <div id="bottomContainer" class="divContainer bordered" style="height:220px;">
                <table class="dialogTable">
                    <thead>
                        <tr>
                            <th>Break</th>
                            <th class="left">Before Break</th>
                            <th class="left">After Break</th>
                        </tr>
                    </thead>
                    <tbody id="LanguageRules" class="stripes">
                        <tr>

                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="column" style="margin-left: 8px; gap: 4px;">
                <button id="moveRuleUp" class="tooltip topRightTooltip"><svg xmlns="http://www.w3.org/2000/svg"
                        height="24px" viewBox="0 0 24 24" width="24px">
                        <path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41z" />
                    </svg><span class="tooltiptext topRightTooltip">Move Rule Up</span></button>
                <button id="moveRuleDown" class="tooltip bottomRightTooltip"><svg xmlns="http://www.w3.org/2000/svg"
                        height="24px" viewBox="0 0 24 24" width="24px">
                        <path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
                    </svg><span class="tooltiptext bottomRightTooltip">Move Rule Down</span></button>
            </div>
        </div>

        <div class="buttonArea">
            <button id="addRule">Add Rule</button>
            <button id="editRule">Edit Rule</button>
            <button id="removeRule">Remove Rule</button>
        </div>

    </div>
    <div class="status" id="status" style="display: none;"></div>
    <script>
        const { Main } = require('../../js/main.js');
        new Main();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <title>Rules</title>
    <link id="theme" rel="stylesheet" type="text/css" href="../css/dark.css">
</head>

<body class="dialogBody">

        <table>
            <tr>
                <td class="middle row">
                    <input type="checkbox" id="Segment" class="middle">
                    <label for="Segments" class="middle">Breaks Segment</label>
                </td>
            </tr>
            <tr>
                <td class="middle">
                    <label for="Before">Before Break</label>
                </td>
                <td class="middle fill_width">
                    <input id="Before" class="fill_width">
                </td>
            </tr>
            <tr>
                <td class="middle">
                    <label for="langPattern">After Break</label>
                </td>
                <td class="middle fill_width">
                    <input id="After" class="fill_width">
                </td>
            </tr>
        </table>

        <div class="buttonArea">
            <button id="accept">Accept</button>
        </div>

</body>

</html>
